# Recipe: Qwen3-ASR-1.7B
# Solo ASR for OpenAI-compatible /v1/audio/transcriptions (e.g. OpenWhispr self-hosted)
# Uses fractional --gpu-memory-utilization (no gpu-mem-util-gb mod) to match current vllm-node image.

recipe_version: "1"
name: Qwen3-ASR-1.7B
description: Qwen3-ASR-1.7B solo on port 8510 with whisper-1 alias

# HuggingFace model to download (optional, for --download-model)
model: Qwen/Qwen3-ASR-1.7B

solo_only: true

# Container image to use
container: vllm-node

# Audio extras on the stock vllm-node image (do not use gpu-mem-util-gb;
# that mod does not match the current image).
mods:
  - mods/vllm-audio

# Default settings (can be overridden via CLI)
defaults:
  port: 8510
  host: 0.0.0.0
  gpu_memory_utilization: 0.1
  max_model_len: 8192
  max_num_seqs: 4

# Environment variables
env: {}

# The vLLM serve command template
command: |
  vllm serve Qwen/Qwen3-ASR-1.7B \
    --host {host} \
    --port {port} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --served-model-name Qwen/Qwen3-ASR-1.7B whisper-1
